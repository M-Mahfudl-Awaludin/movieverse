name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Kunci TMDB hanya dipakai saat runtime aplikasi; build & unit test tidak memanggil jaringan.
  # Isi secret TMDB_API_KEY di repo untuk APK yang bisa dipakai; bila kosong dipakai placeholder.
  TMDB_API_KEY: ${{ secrets.TMDB_API_KEY || 'ci-placeholder-key' }}
  KTLINT_VERSION: 1.3.1

jobs:
  code-style:
    name: Code style (ktlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ktlint
        run: |
          curl -sSLO "https://github.com/pinterest/ktlint/releases/download/${KTLINT_VERSION}/ktlint"
          chmod +x ktlint
          sudo mv ktlint /usr/local/bin/ktlint
      - name: Run ktlint
        run: ktlint "**/src/**/*.kt" "**/*.kts" --reporter=plain

  build-and-test:
    name: Lint, unit test, coverage, APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Android Lint (Inspect Code)
        run: ./gradlew lintDebug --stacktrace

      - name: Unit tests
        run: ./gradlew :core:testDebugUnitTest :app:testDebugUnitTest :favorite:testDebugUnitTest --stacktrace

      - name: Code coverage report (Jacoco)
        run: >
          ./gradlew
          :core:createDebugUnitTestCoverageReport
          :app:createDebugUnitTestCoverageReport
          :favorite:createDebugUnitTestCoverageReport
          --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build release APK (R8 obfuscation)
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload test & coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          if-no-files-found: ignore
          path: |
            **/build/reports/tests/
            **/build/reports/coverage/
            **/build/reports/lint-results-*.html
            **/build/reports/lint-results-*.xml

      - name: Upload APKs and R8 mapping
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk
          if-no-files-found: ignore
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/mapping/release/mapping.txt

  pin-check:
    name: Certificate pin check (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Verify pins against live api.themoviedb.org chain
        run: ./scripts/update_pins.sh --check

  vulnerability-scan:
    name: Vulnerability scan (Trivy)
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan (dependencies, secrets, misconfig)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "0"
