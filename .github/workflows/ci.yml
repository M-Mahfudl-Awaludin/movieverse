name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Kunci TMDB hanya dipakai saat runtime aplikasi; build & unit test tidak memanggil jaringan.
  # Isi secret TMDB_API_KEY di repo untuk APK yang bisa dipakai; bila kosong dipakai placeholder.
  TMDB_API_KEY: ${{ secrets.TMDB_API_KEY || 'ci-placeholder-key' }}
  KTLINT_VERSION: 1.3.1

jobs:
  code-style:
    name: Code style (ktlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install ktlint
        run: |
          curl -sSLO "https://github.com/pinterest/ktlint/releases/download/${KTLINT_VERSION}/ktlint"
          chmod +x ktlint
          sudo mv ktlint /usr/local/bin/ktlint
      - name: Run ktlint
        run: ktlint "**/src/**/*.kt" "**/*.kts" --reporter=plain

  build-and-test:
    name: Unit test, APK, lint, coverage
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Setiap langkah Gradle dijalankan lewat scripts/ci_gradle.sh: bila gagal, penyebabnya
      # muncul sebagai annotation di halaman run dan log lengkap diunggah ke artifact "ci-logs".

      # ---- Tahap wajib: unit test + build APK ----
      - name: Unit tests
        run: bash scripts/ci_gradle.sh :core:testDebugUnitTest :app:testDebugUnitTest :favorite:testDebugUnitTest --stacktrace

      - name: Build debug APK (R8 obfuscation)
        run: bash scripts/ci_gradle.sh assembleDebug --stacktrace

      - name: Build release APK (R8 obfuscation)
        run: bash scripts/ci_gradle.sh assembleRelease --stacktrace

      # ---- Analisis tambahan: hasilnya dibaca dari log / artifact, tidak memblokir build ----
      - name: Code coverage report (Jacoco)
        continue-on-error: true
        run: >
          bash scripts/ci_gradle.sh
          :core:createDebugUnitTestCoverageReport
          :app:createDebugUnitTestCoverageReport
          :favorite:createDebugUnitTestCoverageReport
          --stacktrace

      - name: Android Lint (Inspect Code, semua varian)
        continue-on-error: true
        run: bash scripts/ci_gradle.sh lint --stacktrace

      - name: Lint summary (Performance issues)
        if: always()
        continue-on-error: true
        run: python3 scripts/lint_summary.py .

      - name: Upload test & coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          if-no-files-found: ignore
          path: |
            **/build/reports/tests/
            **/build/reports/coverage/
            **/build/reports/lint-results-*.html
            **/build/reports/lint-results-*.xml

      - name: Upload APKs and R8 mapping
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: apk
          if-no-files-found: ignore
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/mapping/release/mapping.txt

      - name: Upload Gradle logs (diagnostik)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ci-logs
          if-no-files-found: ignore
          path: |
            ci-logs/
            **/build/outputs/mapping/*/missing_rules.txt

  pin-check:
    name: Certificate pin check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify pins against live api.themoviedb.org chain
        # Informasional: hasil lengkap ada di log. Bila tidak cocok, muncul warning (bukan merah)
        # dan pin diperbarui dengan: bash scripts/update_pins.sh
        run: |
          bash scripts/update_pins.sh api.themoviedb.org --check \
            || echo "::warning title=Certificate pin::Pin di CertificatePins.kt tidak cocok dengan server TMDB. Jalankan scripts/update_pins.sh"

  vulnerability-scan:
    name: Vulnerability scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Trivy dijalankan lewat image Docker resmi (bukan GitHub Action) supaya tidak bergantung
      # pada tag action yang bisa berubah. Informasional: gagal/ada temuan hanya jadi warning.
      - name: Trivy filesystem scan (secret, misconfig, vulnerability)
        run: |
          docker run --rm -v "$PWD:/src" aquasec/trivy:latest fs \
            --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code 0 /src \
            || echo "::warning title=Trivy::Pemindaian Trivy tidak dapat diselesaikan (informasional)."
