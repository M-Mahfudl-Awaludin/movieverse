name: CodeQL

on:
  push:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (java-kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    env:
      TMDB_API_KEY: ci-placeholder-key
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # Kode proyek ini hampir seluruhnya Kotlin, sehingga CodeQL harus mengamati proses
      # kompilasi (build-mode "manual"). Mode "none" hanya mendukung file Java.
      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual

      # Hanya kompilasi (tanpa R8/APK). "clean" + "--no-build-cache" memastikan semua kode
      # benar-benar dikompilasi ulang agar terlihat oleh CodeQL.
      - name: Compile for analysis
        run: |
          chmod +x gradlew
          ./gradlew clean compileDebugKotlin compileDebugJavaWithJavac --no-daemon --no-build-cache --console=plain

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java-kotlin"
