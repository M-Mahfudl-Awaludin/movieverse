name: CodeQL

on:
  push:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (java-kotlin)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      # build-mode "none": CodeQL menganalisis kode sumber tanpa menjalankan build Gradle,
      # sehingga hasil analisis tidak bergantung pada status build APK.
      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java-kotlin"
